name: Unity tests

on:
  push:
    branches: [main]
    paths:
      - "client/Assets/**"
      - "client/Packages/**"
      - "client/ProjectSettings/**"
      - ".github/workflows/unity-tests.yml"
  pull_request:
    paths:
      - "client/Assets/**"
      - "client/Packages/**"
      - "client/ProjectSettings/**"
      - ".github/workflows/unity-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5

      # Library フォルダ（インポート結果）を使い回して、2 回目以降を速くする
      - uses: actions/cache@v6
        with:
          path: client/Library
          key: unity-library-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            unity-library-

      # EditMode テスト（Domain / Application 層と Presenter、プレハブの参照）を実行する
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode test results

      # 失敗したときに詳しく調べられるよう、結果ファイルを残す
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unity-test-results
          path: artifacts
