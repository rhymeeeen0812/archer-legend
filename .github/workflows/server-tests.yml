name: Server tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # API のテストは Testcontainers で PostgreSQL を起動する（ubuntu-latest には Docker が入っている）
      - run: dotnet test
